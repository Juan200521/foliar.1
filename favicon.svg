<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- El gradiente exacto que usas en los botones de Foliar -->
    <linearGradient id="fondoGradiente" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  
  <!-- Fondo principal (cuadrado con bordes muy redondeados estilo app móvil) -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#fondoGradiente)"/>
  
  <!-- Silueta de la hoja/documento (Foliar) -->
  <path d="M176 128 h 104 l 64 64 v 192 a 24 24 0 0 1 -24 24 H176 a 24 24 0 0 1 -24 -24 V152 a 24 24 0 0 1 24 -24 z" fill="#ffffff" opacity="0.95"/>
  
  <!-- Doblez de la esquina superior derecha -->
  <path d="M280 128 v 40 a 24 24 0 0 0 24 24 h 40 z" fill="#e2e8f0"/>
  
  <!-- Letra 'F' moderna y geométrica en el centro -->
  <path d="M204 210 h 64 v 24 h -40 v 24 h 34 v 24 h -34 v 40 h -24 z" fill="#8b5cf6"/>
</svg>
